name: Verify compiled core and walk-forward objectives
on:
  push:
    branches: [agent/eda-notebook]
    paths: [.github/workflows/walkforward-checks.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q -r requirements.txt
      - run: python _wf_install.py
      - run: python -m pytest -q --tb=short
