name: Verify CVXPY fitters and baselines
on:
  push:
    branches: [agent/eda-notebook]
    paths: [.github/workflows/verify-revision.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python _apply_revision.py
      - run: python -m pip install -q -r requirements.txt
      - run: python -m pytest -q
      - name: Save verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/takehome/fitters.py src/takehome/features.py tests/test_fitters.py requirements.txt
          git rm _apply_revision.py _fitter_extension.py _blend_extension.py .github/workflows/verify-revision.yml .github/workflows/inspect-sessions.yml
          git commit -m 'Verify CVXPY reference, batched fit interface, meta-combinations and ES sessions'
          git push origin HEAD:agent/eda-notebook
