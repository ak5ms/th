name: Audit alpha forecasts and Ridge volatility
on:
  push:
    branches: [agent/eda-notebook]
    paths: [.github/workflows/alpha-preflight.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q -r requirements.txt
      - name: New tests must fail before implementation
        run: |
          set +e
          python -m pytest tests/test_alpha_forecasts.py -q --tb=short
          result=$?
          test "$result" -eq 1
      - name: Inspect notebook and current volatility calls
        run: |
          python - <<'PY'
          import nbformat
          from pathlib import Path
          nb=nbformat.read('notebooks/01_eda.ipynb',as_version=4)
          for i,c in enumerate(nb.cells):
              print('CELL',i,c.cell_type,c.metadata.get('tags',[]),c.source.splitlines()[0] if c.source else '')
              if c.cell_type=='code' and any(k in c.source for k in ['.ewm(', 'batch_sweep','online_sweep','beta.plot','CVXPY_RECONCILIATION']):
                  print(c.source)
          for p in Path('tests').glob('*.py'):
              text=p.read_text()
              if 'ewm(' in text: print('EWM_TEST',p,'\n',text)
          PY
      - name: Reproduce Ridge exposure issue on full training data
        run: |
          python - <<'PY'
          import numpy as np,pandas as pd
          from takehome.data import training_data
          from takehome.features import with_cashflow_feature
          from takehome.fitters import BatchRidge,walk_forward_sweep
          raw=pd.read_parquet('ESc1_signal_components_5min (6).parquet')
          if 'msgStamp' in raw: raw=raw.set_index('msgStamp')
          df,_=training_data(raw.sort_index()); df=with_cashflow_feature(df)
          X=df.filter(regex='^x[0-9]+$').fillna(0).to_numpy()
          y=df.ret_5m.to_numpy(); w=np.isfinite(y).astype(float)
          models={str(a):BatchRidge(X.shape[1],a,decay=2**(-1/6048)) for a in [.01,100.]}
          paths=walk_forward_sweep(models,X,y,W=w,min_train_size=72576,step=6048)
          for name,m in paths.items():
              p=pd.Series(m.prediction_,index=df.index)
              old=p.ewm(halflife=6048,min_periods=6048).std().replace(0,np.nan)
              new=p.replace(0,np.nan).ewm(halflife=6048,min_periods=6048,ignore_na=True).std().replace(0,np.nan)
              for mode,v in [('old',old),('zero_missing',new)]:
                  exposure=p/v**2; pnl=exposure*df.ret_5m
                  print('RIDGE_DIAGNOSTIC',name,mode,{'zero_forecasts':int(p.eq(0).sum()),'forecast_std':p.std(),'min_ewm_std':v.min(),'p99_abs_exposure':exposure.abs().quantile(.99),'max_abs_exposure':exposure.abs().max(),'max_abs_bar_pnl':pnl.abs().max(),'daily_sharpe':pnl.resample('D').sum().pipe(lambda s:s.mean()/s.std())})
                  top=pnl.abs().nlargest(5).index
                  print(pd.DataFrame({'forecast':p,'ewm_std':v,'exposure':exposure,'return':df.ret_5m,'pnl':pnl}).loc[top].to_string())
          PY
