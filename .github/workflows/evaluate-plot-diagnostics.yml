name: Evaluate family overlays and lagged regression diagnostics
on:
  push:
    branches: [agent/eda-notebook]
    paths: [.github/workflows/evaluate-plot-diagnostics.yml]
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q -r requirements.txt
      - run: python _plot_update.py
      - run: python -m pytest -q
      - name: Execute all training observations
        run: python run_eda.py
      - name: Verify outputs and print calibration
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, nbformat
          nb = nbformat.read('notebooks/01_eda.ipynb', as_version=4)
          code = [c for c in nb.cells if c.cell_type == 'code']
          assert all(c.execution_count is not None for c in code)
          assert not any(o.output_type == 'error' for c in code for o in c.outputs)
          assert not Path('reports').exists() and not Path('EDA_SUMMARY.md').exists()
          assert json.loads(Path('splits.json').read_text())['train_rows'] == 640734
          for family in ['raw', 'dszl', 'interaction', 'residual']:
              c = next(c for c in code if f'family_overlay_{family}' in c.metadata.get('tags', []))
              assert sum('image/png' in o.get('data', {}) for o in c.outputs) == 2
              print(f'VERIFIED {family}: standalone+combination P&L panel and histogram')
          for tag in ['regression_beta_plot', 'regression_calibration_plot']:
              c = next(c for c in code if tag in c.metadata.get('tags', []))
              assert sum('image/png' in o.get('data', {}) for o in c.outputs) == 1
          for c in code:
              if 'regression_calibration_plot' in c.metadata.get('tags', []) or 'meta_summary =' in c.source:
                  for o in c.outputs:
                      if o.output_type == 'stream': print(o.text)
          print('NOTEBOOK_COUNTS', len(code), sum('image/png' in o.get('data', {}) for c in code for o in c.outputs))
          print(nb.cells[-1].source)
          PY
      - name: Save evaluated notebook and remove temporary execution files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks/01_eda.ipynb splits.json README.md
          git rm _plot_update.py .github/workflows/evaluate-plot-diagnostics.yml
          git commit -m 'Store family-specific meta overlays and lagged regression calibration plots'
          git push origin HEAD:agent/eda-notebook
