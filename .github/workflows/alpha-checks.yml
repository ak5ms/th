name: Verify alpha forecasts against CVXPY
on:
  push:
    branches: [agent/eda-notebook]
    paths: [.github/workflows/alpha-checks.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q -r requirements.txt
      - run: python _ar2_install.py
      - run: python -m pytest -q --tb=short
      - name: Full-row AR(2) compute check on representative signal scales
        run: |
          python -u - <<'PY'
          import numpy as np,pandas as pd
          from takehome.data import training_data
          from takehome.features import with_cashflow_feature,backtest,sharpe
          from takehome.fitters import forecast_alpha
          raw=pd.read_parquet('ESc1_signal_components_5min (6).parquet')
          if 'msgStamp' in raw: raw=raw.set_index('msgStamp')
          df,_=training_data(raw.sort_index()); df=with_cashflow_feature(df)
          for name in ['x1','x3','x58','x67','x100']:
              p,info=forecast_alpha(df[name],alpha=.01)
              print('AR2_CHECK',info,'predictions',p.count(),'sharpe',sharpe(backtest(p,df.ret_5m).resample('D').sum()),flush=True)
              assert not np.isinf(p).any()
          PY
