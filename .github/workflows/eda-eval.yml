name: Evaluate full-training EDA

on:
  push:
    branches: [agent/eda-notebook]
    paths: [.github/workflows/eda-eval.yml]

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: agent/eda-notebook
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q -r requirements.txt
      - run: python -m pytest -q
      - name: Update notebook cells
        run: python _prepare_eda.py
      - name: Execute all training observations
        run: python run_eda.py
      - name: Record package versions
        run: python -m pip freeze > reports/environment.txt
      - name: Save evaluated notebook and diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks/01_eda.ipynb EDA_SUMMARY.md reports/column_coverage.csv reports/cashflow_outliers.csv reports/split.json reports/environment.txt
          git rm _prepare_eda.py .github/workflows/eda-eval.yml
          git commit -m 'Store full-training EDA outputs with time-span holdout'
          git push origin HEAD:agent/eda-notebook
