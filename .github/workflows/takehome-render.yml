name: Render takehome comparison charts
on:
  push:
    branches: [agent/eda-notebook]
    paths: [.github/workflows/takehome-render.yml]
permissions:
  contents: write
  actions: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          ref: agent/eda-notebook
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Replay with explicit inline figure capture
        run: |
          git show 689c1b0449874b1fe55ca6ceb774eb59dfcce7b7:.maintenance/evaluate_takehome_revision.py > /tmp/render_takehome.py
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/render_takehome.py')
          s = p.read_text()
          old = 'code_cells = [deepcopy(base.cells[1]), code(load), code(setup),'
          new = '''code_cells = [code("get_ipython().run_line_magic('matplotlib', 'inline')"), deepcopy(base.cells[1]), code(load), code(setup),'''
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          set -o pipefail
          python -u /tmp/render_takehome.py | tee /tmp/takehome-render.log
      - name: Verify charts and full test suite
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import nbformat
          for path in (Path('notebooks/takehome.ipynb'), Path('notebooks/takehome_asset_vol.ipynb')):
              nb = nbformat.read(path, as_version=4)
              nbformat.validate(nb)
              expected = {'coefficient_paths': 1, 'oracle_lead_0': 2, 'oracle_lead_1': 2}
              if path.stem.endswith('_asset_vol'):
                  expected['asset_vol_comparison'] = 6
              for tag, count in expected.items():
                  cell = next(c for c in nb.cells if tag in c.metadata.get('tags', []))
                  images = sum('image/png' in o.get('data', {}) for o in cell.outputs)
                  assert images >= count, (str(path), tag, images, count)
                  print('FIGURES', path.name, tag, images)
              for cell in nb.cells:
                  if cell.cell_type == 'code':
                      ast.parse(cell.source)
                      assert cell.execution_count is not None
                      assert not any(o.output_type == 'error' for o in cell.outputs)
          PY
          set -o pipefail
          MPLBACKEND=Agg pytest -q | tee /tmp/takehome-render-tests.log
          git diff --check
      - name: Publish chart outputs and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/takehome-render.yml
          git add notebooks/takehome.ipynb notebooks/takehome_asset_vol.ipynb
          git diff --cached --check
          git commit -m 'Embed evaluated coefficient, one-row oracle and asset-volatility comparison charts'
          git push origin HEAD:agent/eda-notebook
          git rev-parse HEAD > /tmp/takehome-render-commit.txt
          git archive HEAD notebooks src tests README.md run_eda.py requirements.txt pytest.ini splits.json Takehome.txt | gzip > /tmp/takehome-rendered-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: takehome-rendered-notebooks
          path: |
            /tmp/takehome-rendered-source.tar.gz
            /tmp/takehome-render.log
            /tmp/takehome-render-tests.log
            /tmp/takehome-render-commit.txt
          retention-days: 1
      - name: Remove only temporary artifacts created for this revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in 11280574529 11280484981 11281936107; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done
