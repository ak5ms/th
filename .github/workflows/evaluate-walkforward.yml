name: Evaluate causal model sweeps and predictor leads
on:
  push:
    branches: [agent/eda-notebook]
    paths: [.github/workflows/evaluate-walkforward.yml]
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q -r requirements.txt
      - run: python _wf_install.py && python _wf_notebook.py
      - run: python -m pytest -q --tb=short
      - name: Execute all training rows and all requested sweeps
        run: |
          python -u - <<'PY'
          import runpy
          from nbclient import NotebookClient
          original = NotebookClient.__init__
          def report(cell, cell_index, **kwargs):
              print('FINISHED_CELL',cell_index,cell.get('metadata',{}).get('tags',[]),flush=True)
              for o in cell.get('outputs',[]):
                  if o.output_type=='stream' and cell.get('metadata',{}).get('tags'):
                      print(o.text,flush=True)
          def init(self,*args,**kwargs):
              kwargs['on_cell_executed']=report
              original(self,*args,**kwargs)
          NotebookClient.__init__=init
          runpy.run_path('run_eda.py',run_name='__main__')
          PY
      - name: Verify evaluated results
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat,json
          nb=nbformat.read('notebooks/01_eda.ipynb',as_version=4)
          code=[c for c in nb.cells if c.cell_type=='code']
          assert all(c.execution_count is not None for c in code)
          assert not any(o.output_type=='error' for c in code for o in c.outputs)
          assert not Path('reports').exists()
          assert json.loads(Path('splits.json').read_text())['train_rows']==640734
          assert 'literal_daily_sharpe' not in nbformat.writes(nb)
          for h in [0,1,2,6,12,24]:
              c=next(c for c in code if f'oracle_lead_{h}' in c.metadata.get('tags',[]))
              assert sum('image/png' in o.get('data',{}) for o in c.outputs)==2
          for tag in ['regression_setup','batch_oos_sweep','all_predictor_fit','implementation_audit','oracle_summary','regression_calibration_plot']:
              c=next(c for c in code if tag in c.metadata.get('tags',[]))
              print('VERIFIED_SECTION',tag)
              for o in c.outputs:
                  if o.output_type=='stream': print(o.text)
          print(nb.cells[-1].source)
          PY
      - name: Commit evaluated notebook and installed helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/takehome/fitters.py src/takehome/features.py tests/test_regression_sweeps.py notebooks/01_eda.ipynb README.md splits.json
          git rm _wf_core.txt _wf_batch.txt _wf_install.py _wf_notebook.py .github/workflows/walkforward-preflight.yml .github/workflows/walkforward-checks.yml .github/workflows/evaluate-walkforward.yml
          git commit -m 'Store jitclass, x100, causal Ridge/lasso sweeps and future-predictor diagnostics'
          git push origin HEAD:agent/eda-notebook
