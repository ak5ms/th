name: Evaluate standalone transformations
on:
  push:
    branches: [agent/eda-notebook]
    paths: [.github/workflows/eda-transforms.yml]
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q -r requirements.txt
      - run: python -m pytest -q
      - run: python _add_transforms.py
      - name: Execute every training row and pair
        run: python run_eda.py
      - name: Verify and print transformation results
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, nbformat
          nb = nbformat.read('notebooks/01_eda.ipynb', as_version=4)
          code = [c for c in nb.cells if c.cell_type == 'code']
          assert all(c.execution_count is not None for c in code)
          assert not any(o.output_type == 'error' for c in code for o in c.outputs)
          assert not Path('reports').exists() and not Path('EDA_SUMMARY.md').exists()
          assert json.loads(Path('splits.json').read_text())['train_rows'] == 640734
          for c in code:
              if 'transformation_comparison =' in c.source:
                  for o in c.outputs:
                      if o.output_type == 'stream': print(o.text)
          for key in ['dszl_daily,', 'interaction_daily,', 'residual_daily,']:
              cell = next(c for c in code if key in c.source)
              assert sum('image/png' in o.get('data', {}) for o in cell.outputs) == 2
          print('Embedded figures:', sum('image/png' in o.get('data', {}) for c in code for o in c.outputs))
          print(nb.cells[-1].source)
          PY
      - name: Store evaluated notebook and remove temporary execution files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks/01_eda.ipynb splits.json README.md
          git rm _add_transforms.py .github/workflows/eda-transforms.yml
          git commit -m 'Store evaluated dszl, interaction and residual experiments'
          git push origin HEAD:agent/eda-notebook
