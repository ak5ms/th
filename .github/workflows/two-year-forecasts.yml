name: Two-year walk-forward forecasts
on:
  push:
    branches: [agent/eda-notebook]
    paths: [.github/workflows/two-year-forecasts.yml]
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: agent/eda-notebook
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Apply verified window changes
        run: |
          python .maintenance/update_two_year_fitters.py
          python .maintenance/update_two_year_notebooks.py
      - name: Run full test suite
        run: |
          set -o pipefail
          MPLBACKEND=Agg pytest -q | tee /tmp/two-year-tests.log
      - name: Refresh all window-dependent notebook outputs
        run: |
          set -o pipefail
          python -u .maintenance/refresh_two_year.py | tee /tmp/two-year-execution.log
          cp forecasts/batched_lasso_walk_forward.parquet /tmp/notebook-validation.parquet
      - name: Generate and validate final forecast deliverables
        run: |
          set -o pipefail
          python -u run_forecast.py | tee /tmp/two-year-forecast.log
          python - <<'PY'
          import ast,json
          from pathlib import Path
          import nbformat,numpy as np,pandas as pd
          a=pd.read_parquet('/tmp/notebook-validation.parquet')
          b=pd.read_parquet('forecasts/batched_lasso_walk_forward.parquet')
          pd.testing.assert_index_equal(a.index,b.index)
          np.testing.assert_allclose(a.forecast,b.forecast,rtol=1e-9,atol=1e-12)
          m=json.loads(Path('forecasts/batched_lasso_metadata.json').read_text())
          assert m['validation_rows']==490543 and m['oos_rows']==150048
          assert m['train_years']==m['test_years']==2
          for name in ('walk_forward','oos'):
              frame=pd.read_parquet(f'forecasts/batched_lasso_{name}.parquet')
              assert frame.index.is_monotonic_increasing and frame.index.is_unique
              assert np.isfinite(frame.forecast).all()
          for path in Path('notebooks').glob('*.ipynb'):
              nb=nbformat.read(path,4);nbformat.validate(nb)
              for c in nb.cells:
                  if c.cell_type=='code':
                      ast.parse(c.source)
                      assert c.execution_count is not None
                      assert not any(o.output_type=='error' for o in c.outputs)
              if path.stem.startswith('takehome'):
                  for tag in ('batch_oos_sweep','coefficient_paths','regression_calibration_plot'):
                      c=next(c for c in nb.cells if tag in c.metadata.get('tags',[]))
                      assert any('image/png' in o.get('data',{}) for o in c.outputs), (path,tag)
          print('VERIFIED: notebook and standalone batch forecasts agree; complete finite withheld coverage.')
          PY
          MPLBACKEND=Agg pytest -q
          git diff --check
      - name: Publish evaluated changes and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/two-year-forecasts.yml .maintenance/update_two_year_fitters.py .maintenance/update_two_year_notebooks.py .maintenance/refresh_two_year.py
          git add src/takehome/fitters.py README.md run_eda.py notebooks
          git add forecasts/*.parquet forecasts/*metadata.json forecasts/*folds.csv forecasts/*windows.csv
          git diff --cached --check
          git commit -m 'Use two-year rolling windows and publish evaluated batched Lasso forecasts'
          git push origin HEAD:agent/eda-notebook
          git rev-parse HEAD | tee /tmp/two-year-commit.txt
      - name: Package source, notebooks, forecasts and verification
        run: |
          mkdir -p /tmp/two-year-deliverables
          git archive HEAD notebooks src tests README.md run_eda.py run_forecast.py requirements.txt pytest.ini splits.json Takehome.txt forecasts | tar -x -C /tmp/two-year-deliverables
          cp forecasts/batched_lasso_walk_forward.csv forecasts/batched_lasso_oos.csv /tmp/two-year-deliverables/forecasts/
          tar -czf /tmp/two-year-deliverables.tar.gz -C /tmp/two-year-deliverables .
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: two-year-lasso-deliverables
          path: |
            /tmp/two-year-deliverables.tar.gz
            /tmp/two-year-tests.log
            /tmp/two-year-execution.log
            /tmp/two-year-forecast.log
            /tmp/two-year-commit.txt
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: two-year-failure-evidence
          path: |
            /tmp/two-year-*.log
            /tmp/two-year-failed.ipynb
          retention-days: 1
