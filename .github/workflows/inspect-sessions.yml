name: Inspect training sessions
on:
  push:
    branches: [agent/eda-notebook]
    paths: [.github/workflows/inspect-sessions.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q -r requirements.txt cvxpy pandas_market_calendars
      - name: Inspect data and calendar
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import pandas as pd, numpy as np, inspect
          import pandas_market_calendars as mcal
          from takehome.data import training_data
          raw = pd.read_parquet('ESc1_signal_components_5min (6).parquet')
          if raw.index.name and raw.index.name not in raw.columns: raw = raw.reset_index()
          raw = raw.set_index('msgStamp').sort_index()
          df, split = training_data(raw)
          del raw
          print(split.to_string())
          print('INDEX', df.index.dtype, df.index.tz, df.index.to_series().diff().value_counts().head(8))
          grid = pd.date_range(df.index.min().floor('5min'), df.index.max().ceil('5min'), freq='5min')
          quote = df.wmid.reindex(grid).notna()
          profile = quote.groupby([grid.dayofweek, grid.hour*60+grid.minute]).mean().unstack(0).reindex(columns=range(7))
          print('WEEKLY PROFILE TRANSITIONS (>50% quote presence), minutes in local timezone')
          for day in range(7):
              rule = profile[day].gt(.5)
              change = rule.ne(rule.shift())
              print(day, [(int(m), bool(rule.loc[m]), round(float(profile.loc[m, day]),4)) for m in rule.index[change]])
          print('BOUNDARIES', profile.loc[range(15*60,19*60+5,5)].round(3).to_string())
          print('QUOTE COUNTS', int(quote.sum()), 'GRID',len(grid),'ROWS',len(df),'NULL WMID',df.wmid.isna().mean())
          cal=mcal.get_calendar('CME_Equity')
          print('CALENDAR',cal.name,cal.regular_market_times)
          print('RULE SOURCE',inspect.getsource(type(cal)))
          for start,stop in [('2014-12-23','2014-12-27'),('2015-04-02','2015-04-06'),('2020-11-25','2020-11-28'),('2022-06-17','2022-06-21')]:
              s=cal.schedule(start,stop,tz='America/New_York')
              print('SCHEDULE',s.to_string())
          print('LIBRARIES', __import__('cvxpy').__version__,mcal.__version__)
          PY
