name: Combined features and lagged model selection
on:
  push:
    branches: [agent/eda-notebook]
    paths: [.github/workflows/combined-selection.yml]
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/eda-notebook
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Apply verified notebook and selection changes
        run: |
          python - <<'PY'
          import base64,copy,hashlib,json,lzma,subprocess
          from pathlib import Path
          import nbformat
          encoded=''.join(Path(f'.maintenance/selection-{i}.b64').read_text().strip() for i in range(3))
          raw=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='377898a639e459ce00a0d6f3fdb0083b663e8ef7f7751cbe2e5722746a15ed00'
          m=json.loads(raw)
          for path,sha in m['base_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert actual==sha,(path,'source changed; reconcile instead of overwriting',actual,sha)
          for name,ops in m['files'].items():
              p=Path(name)
              lines=p.read_text().splitlines(keepends=True) if p.exists() else []
              for op in reversed(ops):lines[op['lo']:op['hi']]=[op['lines']]
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(''.join(lines))
          p=Path('notebooks/takehome.ipynb');prior=nbformat.read(p,4);cells=[]
          for op in m['notebook']:
              if 'ref' in op:
                  c=copy.deepcopy(prior.cells[op['ref']])
                  if 'source' in op:
                      c.source=op['source']
                      if c.cell_type=='code':
                          c.outputs=[];c.execution_count=None;c.metadata.pop('execution',None)
                  if 'tags' in op:c.metadata['tags']=op['tags']
              else:
                  factory=nbformat.v4.new_code_cell if op['type']=='code' else nbformat.v4.new_markdown_cell
                  c=factory(op['source'],id=op['id'],metadata={'tags':op['tags']})
              cells.append(c)
          nb=nbformat.v4.new_notebook(cells=cells,metadata=prior.metadata)
          nbformat.validate(nb);nbformat.write(nb,p)
          for name in m['delete']:Path(name).unlink(missing_ok=True)
          Path('.maintenance/run_revision.py').write_text(m['runner'])
          # Same terminal fit; correctly age embargoed rows before live updates.
          p=Path('src/takehome/selection.py');s=p.read_text()
          old='        live[c:d] = model.fit_predict(X[c:d], y[c:d], W=w[c:d])'
          new='''        if b < c:
                      # Advance forgetting through embargoed rows, without their labels.
                      model.fit(X[b:c], np.full(c-b, np.nan), W=np.zeros(c-b))
                  live[c:d] = model.fit_predict(X[c:d], y[c:d], W=w[c:d])'''
          assert s.count(old)==1;p.write_text(s.replace(old,new))
          p=Path('tests/test_prequential_selection.py')
          p.write_text(p.read_text()+'''

          def test_live_stream_ages_embargo_rows_without_learning_their_labels():
              from takehome.fitters import StreamingWeightedLasso
              mod=selection_module();rng=np.random.default_rng(24)
              X=rng.normal(size=(40,2));y=X@np.array([.4,-.2])+rng.normal(0,.2,40)
              folds=[dict(f,train_stop=f['train_stop']-2) for f in windows()]
              grid={.01:BatchLasso(2,.8,.01,fit_intercept=True),.3:BatchLasso(2,.8,.3,fit_intercept=True)}
              tuned=mod.walk_forward_select(grid,X,y,folds=folds)
              out=mod.stream_selected_folds(tuned,X,y,tol=1e-10,max_iter=30000)
              for i in (1,2):
                  f=folds[i];a,b,c,d=(f[k] for k in ('train_start','train_stop','predict_start','predict_stop'))
                  ref=StreamingWeightedLasso(2,.8,tuned.choices_[i],fit_intercept=True,tol=1e-10,max_iter=30000)
                  ref.fit(X[a:b],y[a:b])
                  ref.fit(X[b:c],np.full(c-b,np.nan),W=np.zeros(c-b))
                  expected=ref.fit_predict(X[c:d],y[c:d])
                  assert_allclose(out['live'][c:d],expected,atol=1e-12)
          ''')
          PY
      - name: Verify full test suite
        run: |
          set -o pipefail
          MPLBACKEND=Agg pytest -q | tee /tmp/selection-tests-before.log
          git diff --check
      - name: Run every changed model section and the final holdout export
        run: |
          set -o pipefail
          python -u .maintenance/run_revision.py | tee /tmp/selection-execution.log
      - name: Verify executed results and the single prediction file
        run: |
          python - <<'PY'
          import ast,hashlib
          from pathlib import Path
          import nbformat,numpy as np,pandas as pd
          assert {p.name for p in Path('notebooks').glob('*.ipynb')}=={'takehome.ipynb'}
          assert sorted(p.name for p in Path('forecasts').iterdir())==['predictions.parquet']
          path=Path('forecasts/predictions.parquet');frame=pd.read_parquet(path)
          assert len(frame)==150048 and list(frame.columns)==['forecast']
          assert frame.index.name=='msgStamp' and frame.index.is_unique and frame.index.is_monotonic_increasing
          assert isinstance(frame.index,pd.DatetimeIndex) and frame.index.tz is not None
          assert np.isfinite(frame.forecast).all()
          assert frame.index[0]==pd.Timestamp('2024-09-01 18:00:00',tz='America/New_York')
          assert frame.index[-1]==pd.Timestamp('2026-08-31 17:55:00',tz='America/New_York')
          nb=nbformat.read('notebooks/takehome.ipynb',4);nbformat.validate(nb)
          for c in nb.cells:
              if c.cell_type=='code':
                  ast.parse(c.source)
                  assert c.execution_count is not None,c.metadata.get('tags',[])
                  assert not any(o.output_type=='error' for o in c.outputs)
          for tag in ('batch_oos_sweep','coefficient_paths','selected_ridge_backtest'):
              c=next(c for c in nb.cells if tag in c.metadata.get('tags',[]))
              assert any('image/png' in o.get('data',{}) for o in c.outputs),tag
          print('HOLDOUT_ROWS',len(frame));print('HOLDOUT_FIRST',frame.index[0]);print('HOLDOUT_LAST',frame.index[-1])
          print('PARQUET_SHA256',hashlib.sha256(path.read_bytes()).hexdigest())
          print('VERIFIED: one timestamped holdout-only Parquet; no auxiliary forecast files.')
          PY
          set -o pipefail
          MPLBACKEND=Agg pytest -q | tee /tmp/selection-tests-after.log
          git diff --check
      - name: Publish evaluated notebook and clean forecast directory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/combined-selection.yml .maintenance/selection-0.b64 .maintenance/selection-1.b64 .maintenance/selection-2.b64
          rm .maintenance/run_revision.py
          git add -A README.md run_eda.py src/takehome/features.py src/takehome/selection.py tests notebooks forecasts
          git diff --cached --check
          git commit -m 'Select regularization on previous test folds using raw plus dszl features; export only holdout predictions'
          git push origin HEAD:agent/eda-notebook
          git rev-parse HEAD > /tmp/selection-commit.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: selected-holdout-predictions
          path: |
            forecasts/predictions.parquet
            notebooks/takehome.ipynb
            /tmp/selection-tests-before.log
            /tmp/selection-tests-after.log
            /tmp/selection-execution.log
            /tmp/selection-commit.txt
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: selection-failure-evidence
          path: |
            /tmp/selection-*.log
            /tmp/model_revision_failed.ipynb
          retention-days: 1
