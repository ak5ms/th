name: Evaluate all-predictor regression backtests
on:
  push:
    branches: [agent/eda-notebook]
    paths: [.github/workflows/evaluate-regression-sweep.yml]
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q -r requirements.txt
      - run: python _source_patch.py && python _notebook_patch.py
      - run: python -m pytest -q
      - name: Execute all training observations and every regression penalty
        run: |
          python - <<'PY'
          import runpy
          from nbclient import NotebookClient
          original = NotebookClient.execute_cell
          def logged(self, cell, cell_index, *args, **kwargs):
              print('EXECUTING_CELL',cell_index,cell.get('metadata',{}).get('tags',[]),flush=True)
              result = original(self,cell,cell_index,*args,**kwargs)
              for output in result.get('outputs',[]):
                  if output.output_type == 'stream': print(output.text,flush=True)
              return result
          NotebookClient.execute_cell = logged
          runpy.run_path('run_eda.py',run_name='__main__')
          PY
      - name: Verify evaluated outputs
        run: |
          python - <<'PY'
          import nbformat,json
          from pathlib import Path
          nb=nbformat.read('notebooks/01_eda.ipynb',as_version=4)
          code=[c for c in nb.cells if c.cell_type=='code']
          assert all(c.execution_count is not None for c in code)
          assert not any(o.output_type=='error' for c in code for o in c.outputs)
          assert json.loads(Path('splits.json').read_text())['train_rows']==640734
          assert not Path('reports').exists()
          for tag in ['ridge_backtest_sweep','all_predictor_backtests','lasso_backtest_sweep','regression_calibration_plot']:
              c=next(c for c in code if tag in c.metadata.get('tags',[]))
              assert any('image/png' in o.get('data',{}) for o in c.outputs)
              print('VERIFIED',tag)
              for o in c.outputs:
                  if o.output_type=='stream': print(o.text)
          print('NOTEBOOK_COUNTS',len(code),sum('image/png' in o.get('data',{}) for c in code for o in c.outputs))
          print(nb.cells[-1].source)
          PY
      - name: Store notebook and source, remove temporary execution files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks/01_eda.ipynb splits.json README.md src/takehome/fitters.py src/takehome/features.py src/takehome/plots.py tests/test_plot_diagnostics.py tests/test_regression_notebook.py
          git rm _source_patch.py _notebook_patch.py .github/workflows/regression-preflight.yml .github/workflows/evaluate-regression-sweep.yml
          git commit -m 'Store all-predictor unit-weight lasso and Ridge backtest sweeps with secondary-axis overlays'
          git push origin HEAD:agent/eda-notebook
