name: Evaluate standalone features and weighted online lasso
on:
  push:
    branches: [agent/eda-notebook]
    paths: [.github/workflows/eda-modeling.yml]
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q -r requirements.txt
      - run: python -m pytest -q
      - run: python _add_modeling.py
      - name: Execute all training data
        run: python run_eda.py
      - name: Verify and print new notebook results
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, nbformat
          nb = nbformat.read('notebooks/01_eda.ipynb', as_version=4)
          code = [c for c in nb.cells if c.cell_type == 'code']
          assert all(c.execution_count is not None for c in code)
          assert not any(o.output_type == 'error' for c in code for o in c.outputs)
          assert not Path('reports').exists() and not Path('EDA_SUMMARY.md').exists()
          assert json.loads(Path('splits.json').read_text())['train_rows'] == 640734
          source = '\n'.join(c.source for c in nb.cells)
          assert '# Standalone feature importance' in source
          assert '# Initial fitter: online weighted lasso' in source
          for c in code:
              if any(key in c.source for key in ['standalone =', 'X_check =', 'X_fit =']):
                  for o in c.outputs:
                      if o.output_type == 'stream': print(o.text)
                      if 'text/plain' in o.get('data', {}): print(o.data['text/plain'])
          print('FIGURES:', sum('image/png' in o.get('data', {}) for c in code for o in c.outputs))
          print(nb.cells[-1].source)
          PY
      - name: Commit evaluated notebook; remove temporary migration and workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks/01_eda.ipynb splits.json
          git rm _add_modeling.py .github/workflows/eda-modeling.yml
          git commit -m 'Store executed standalone-feature and online-lasso notebook sections'
          git push origin HEAD:agent/eda-notebook
