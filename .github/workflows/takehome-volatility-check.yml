name: Takehome volatility comparison
on:
  push:
    branches: [agent/eda-notebook]
    paths: [.github/workflows/takehome-volatility-check.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Package offline test dependencies
        run: |
          python -m pip download --only-binary=:all: --dest /tmp/takehome-wheels 'pyarrow>=15,<30' 'cvxpy>=1.6,<2' 'diptest>=0.10,<1' 'pandas_market_calendars==5.4.0'
      - uses: actions/upload-artifact@v4
        with:
          name: takehome-offline-dependencies
          path: /tmp/takehome-wheels
          retention-days: 1
          compression-level: 0
