name: Takehome volatility comparison
on:
  push:
    branches: [agent/eda-notebook]
    paths: [.github/workflows/takehome-volatility-check.yml]
permissions:
  contents: write
jobs:
  verify-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: agent/eda-notebook
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply notebook revision
        run: |
          python .maintenance/apply_takehome_revision.py
          cp .maintenance/test_asset_volatility_comparison.py tests/test_asset_volatility_comparison.py
      - name: Verify full test suite
        run: |
          set -o pipefail
          pytest -q | tee /tmp/takehome-tests.log
      - name: Replay requested diagnostics on all training rows
        run: |
          set -o pipefail
          python -u .maintenance/evaluate_takehome_revision.py | tee /tmp/takehome-evaluation.log
      - name: Validate evaluated notebooks and tests
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import nbformat
          for path in (Path('notebooks/takehome.ipynb'), Path('notebooks/takehome_asset_vol.ipynb')):
              nb = nbformat.read(path, as_version=4)
              nbformat.validate(nb)
              for c in nb.cells:
                  if c.cell_type == 'code':
                      ast.parse(c.source)
                      assert c.execution_count is not None
                      assert not any(o.output_type == 'error' for o in c.outputs)
              tags = {t for c in nb.cells for t in c.metadata.get('tags', []) if t.startswith('oracle_lead_')}
              assert tags == {'oracle_lead_0', 'oracle_lead_1'}
              print('VALIDATED', path)
          PY
          pytest -q
          git diff --check
      - name: Commit evaluated notebooks and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/takehome-volatility-check.yml
          git rm .maintenance/apply_takehome_revision.py .maintenance/evaluate_takehome_revision.py .maintenance/test_asset_volatility_comparison.py
          git add -A notebooks src/takehome/features.py README.md run_eda.py tests/test_regression_notebook.py tests/test_runner.py tests/test_asset_volatility_comparison.py
          git diff --cached --check
          git commit -m 'Rename takehome notebook and evaluate isolated lagged asset-volatility sizing'
          git push origin HEAD:agent/eda-notebook
          git rev-parse HEAD | tee /tmp/takehome-final-commit.txt
      - name: Package evaluated notebooks and diagnostic evidence
        run: |
          git archive HEAD | gzip > /tmp/takehome-revision-source.tar.gz
          tar -czf /tmp/takehome-revision-evidence.tar.gz -C /tmp takehome-results takehome-diagnostic-executed.ipynb takehome-tests.log takehome-evaluation.log takehome-final-commit.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: takehome-evaluated-revision
          path: |
            /tmp/takehome-revision-source.tar.gz
            /tmp/takehome-revision-evidence.tar.gz
          retention-days: 1
          compression-level: 0
