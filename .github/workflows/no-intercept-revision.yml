name: Variance scaled zero intercept revision
on:
  push:
    branches: [agent/eda-notebook]
    paths: [.github/workflows/no-intercept-revision.yml]
permissions:
  contents: write
jobs:
  execute-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Apply tested revision only to matching original files
        run: |
          python - <<'PY'
          import base64,copy,hashlib,json,lzma
          from pathlib import Path
          import nbformat
          encoded=''.join(Path(f'.maintenance/zero-intercept-part-{i}.b64').read_text().strip() for i in range(3))
          raw=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='1e3480c0ab288de3908360be1bb98fdf90b025ee25be99a8e7ce378afe84db06'
          m=json.loads(raw)
          for name,expected in m['base'].items():
              p=Path(name)
              actual=hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
              assert actual==expected,(name,'base changed; reconcile instead of overwriting')
          for name,ops in m['files'].items():
              p=Path(name)
              lines=p.read_text().splitlines(keepends=True) if p.exists() else []
              for op in reversed(ops):lines[op['lo']:op['hi']]=[op['text']]
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(''.join(lines))
          for name,ops in m['notebook'].items():
              p=Path(name);original=nbformat.read(p,4);cells=[]
              for op in ops:
                  if 'ref' in op:
                      c=copy.deepcopy(original.cells[op['ref']])
                      if 'source' in op:c.source=op['source']
                      if 'tags' in op:c.metadata['tags']=op['tags']
                  else:
                      factory=nbformat.v4.new_code_cell if op['type']=='code' else nbformat.v4.new_markdown_cell
                      c=factory(op['source'],id=op['id'],metadata={'tags':op['tags']})
                  if c.cell_type=='code':
                      c.outputs=[];c.execution_count=None;c.metadata.pop('execution',None)
                  cells.append(c)
              notebook=nbformat.v4.new_notebook(cells=cells,metadata=original.metadata)
              nbformat.validate(notebook);nbformat.write(notebook,p)
          print('APPLIED verified variance scaling, nonnegative variants, and no-intercept configuration')
          PY
          git diff --check
      - name: Full unit and integration tests
        run: |
          set -o pipefail
          MPLBACKEND=Agg pytest -q | tee /tmp/zero-intercept-tests-before.log
      - name: Verify actual research fits and holdout inference before full EDA
        run: |
          set -o pipefail
          python -u .maintenance/zero-intercept-preflight.py | tee /tmp/zero-intercept-preflight.log
          cp forecasts/predictions.parquet /tmp/zero-intercept-preflight-predictions.parquet
      - uses: actions/upload-artifact@v4
        with:
          name: zero-intercept-preflight
          path: |
            /tmp/zero-intercept-preflight.log
            /tmp/zero-intercept-preflight.ipynb
            /tmp/zero-intercept-preflight-metrics.json
          retention-days: 1
      - name: Complete fresh-kernel full notebook execution
        env:
          FAILURE_NOTEBOOK: /tmp/zero-intercept-full-failed.ipynb
        run: |
          set -o pipefail
          python -u run_eda.py | tee /tmp/zero-intercept-full-execution.log
      - name: Verify every output and the single holdout Parquet
        run: |
          python - <<'PY'
          import ast,hashlib,json
          from pathlib import Path
          import nbformat,numpy as np,pandas as pd
          path=Path('notebooks/takehome.ipynb')
          assert {p.name for p in path.parent.glob('*.ipynb')}=={'takehome.ipynb'}
          n=nbformat.read(path,4);nbformat.validate(n)
          code=[c for c in n.cells if c.cell_type=='code']
          assert len(code)==43
          assert [c.execution_count for c in code]==list(range(1,len(code)+1))
          outputs=[]
          for c in code:
              ast.parse(c.source)
              assert not any(o.output_type=='error' for o in c.outputs)
              assert 'fit_intercept=True' not in c.source.replace(' ','')
              for o in c.outputs:
                  if o.output_type=='stream':outputs.append(o.text)
          text='\n'.join(outputs)
          for marker in ('PREFIT_VARIANCE_CHECK','BATCH_ZERO_INTERCEPT_CHECK','STREAM_ZERO_INTERCEPT_CHECK','HOLDOUT_ZERO_INTERCEPT_CHECK','ZERO_INTERCEPT_DIRECTIONAL_AUDIT'):
              assert marker in text,marker
          for tag in ('family_overlay_raw','family_overlay_dszl','family_overlay_interaction','family_overlay_residual','oracle_lead_0','oracle_lead_1','batch_oos_sweep','all_predictor_fit','coefficient_paths','directional_bias','selected_ridge_backtest'):
              c=next(c for c in code if tag in c.metadata.get('tags',[]))
              assert any('image/png' in o.get('data',{}) for o in c.outputs),tag
          assert 'fresh-kernel, complete top-to-bottom execution' in n.cells[-1].source
          for tag in ('regression_setup','submission_design'):
              c=next(c for c in code if tag in c.metadata.get('tags',[]))
              assert 'variance_scaled_design' in c.source and 'variance_hl=HL' in c.source
          p=Path('forecasts/predictions.parquet')
          assert list(p.parent.iterdir())==[p]
          f=pd.read_parquet(p)
          assert len(f)==150048 and list(f.columns)==['forecast']
          assert f.index.name=='msgStamp' and f.index.tz is not None
          assert f.index.is_unique and f.index.is_monotonic_increasing
          assert np.isfinite(f.forecast).all()
          pd.testing.assert_frame_equal(f,pd.read_parquet('/tmp/zero-intercept-preflight-predictions.parquet'))
          report=dict(code_cells=len(code),figures=sum('image/png' in o.get('data',{}) for c in code for o in c.outputs),
              forecast_rows=len(f),forecast_first=str(f.index[0]),forecast_last=str(f.index[-1]),
              positive_forecast_fraction=float(f.forecast.gt(0).mean()),mean_forecast=float(f.forecast.mean()),
              std_forecast=float(f.forecast.std()),sha256=hashlib.sha256(p.read_bytes()).hexdigest(),
              intercepts='exactly zero: all batch, streaming, constrained and final candidate fits',
              prefit_transform='[X, dszl(X,10)] / EWMVar, half-life=6048; no demeaning; no square root',
              full_fresh_execution=True,preflight_forecast_matches=True)
          Path('/tmp/zero-intercept-verification.json').write_text(json.dumps(report,indent=2)+'\n')
          Path('/tmp/zero-intercept-cell-output.txt').write_text(text)
          print(json.dumps(report,indent=2))
          PY
          set -o pipefail
          MPLBACKEND=Agg pytest -q | tee /tmp/zero-intercept-tests-after.log
          git diff --check
      - name: Publish verified source, complete notebook and single forecast
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/no-intercept-revision.yml .maintenance/zero-intercept-part-0.b64 .maintenance/zero-intercept-part-1.b64 .maintenance/zero-intercept-part-2.b64 .maintenance/zero-intercept-preflight.py
          git add README.md notebooks/takehome.ipynb src/takehome/features.py src/takehome/fitters.py src/takehome/selection.py tests/test_alpha_forecasts.py tests/test_regression_sweeps.py tests/test_submission_revision.py tests/test_transform_experiments.py tests/test_walkforward_revision.py tests/test_variance_zero_intercept.py forecasts/predictions.parquet
          git diff --cached --check
          git commit -m 'Variance-scale combined features and rerun all models without intercepts, including nonnegative variants'
          git push origin HEAD:agent/eda-notebook
          git rev-parse HEAD > /tmp/zero-intercept-commit.txt
          mkdir -p /tmp/zero-intercept-delivery
          git archive HEAD notebooks src tests README.md run_eda.py requirements.txt pytest.ini splits.json Takehome.txt .gitignore .gitattributes forecasts | tar -x -C /tmp/zero-intercept-delivery
          cp forecasts/predictions.parquet /tmp/zero-intercept-delivery/forecasts/
          tar -czf /tmp/zero-intercept-delivery.tar.gz -C /tmp/zero-intercept-delivery .
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: variance-scaled-zero-intercept-delivery
          path: |
            /tmp/zero-intercept-delivery.tar.gz
            /tmp/zero-intercept-tests-before.log
            /tmp/zero-intercept-tests-after.log
            /tmp/zero-intercept-full-execution.log
            /tmp/zero-intercept-preflight-metrics.json
            /tmp/zero-intercept-verification.json
            /tmp/zero-intercept-cell-output.txt
            /tmp/zero-intercept-commit.txt
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: zero-intercept-failure-evidence
          path: |
            /tmp/zero-intercept-*.log
            /tmp/zero-intercept-preflight.ipynb
            /tmp/zero-intercept-full-failed.ipynb
            /tmp/zero-intercept-preflight-metrics.json
          retention-days: 1
