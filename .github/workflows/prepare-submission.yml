name: Prepare submission notebooks
on:
  push:
    branches: [agent/eda-notebook]
    paths: [.github/workflows/prepare-submission.yml]
permissions:
  contents: write
jobs:
  execute-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/eda-notebook
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Apply checksum-verified local revision to unchanged source
        run: |
          python - <<'PY'
          import base64,copy,hashlib,json,lzma,subprocess
          from pathlib import Path
          import nbformat
          encoded=''.join(Path(f'.maintenance/submission-part-{i}.b64').read_text().strip() for i in range(3))
          raw=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='37b6f342ee76917f8aa364a13d42802421a216b00ec2eeeb7588a25c4be2a4c8'
          m=json.loads(raw)
          for path,sha in m['base_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert actual==sha,(path,'source changed; reconcile instead of overwriting',actual,sha)
          for name,ops in m['files'].items():
              p=Path(name)
              lines=p.read_text().splitlines(keepends=True) if p.exists() else []
              for op in reversed(ops):
                  lines[op['lo']:op['hi']]=[op['lines']]
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(''.join(lines))
          for name,spec in m['notebooks'].items():
              p=Path(name)
              prior=nbformat.read(p,4) if p.exists() else nbformat.v4.new_notebook()
              cells=[]
              for op in spec['cells']:
                  if 'ref' in op:
                      c=copy.deepcopy(prior.cells[op['ref']])
                      if 'source' in op:c.source=op['source']
                      if 'tags' in op:c.metadata['tags']=op['tags']
                  else:
                      factory=nbformat.v4.new_code_cell if op['type']=='code' else nbformat.v4.new_markdown_cell
                      c=factory(op['source'],id=op['id'],metadata={'tags':op['tags']})
                  if c.cell_type=='code':
                      c.outputs=[];c.execution_count=None;c.metadata.pop('execution',None)
                  cells.append(c)
              nb=nbformat.v4.new_notebook(cells=cells,metadata=spec['metadata'])
              nbformat.validate(nb);nbformat.write(nb,p)
          for name in m['delete']:
              Path(name).unlink(missing_ok=True)
          print('APPLIED',len(m['files']),'source revisions and',len(m['notebooks']),'notebooks')
          PY
      - name: Full test suite before execution
        run: |
          set -o pipefail
          MPLBACKEND=Agg pytest -q | tee /tmp/submission-tests-before.log
          git diff --check
      - name: Complete fresh-kernel submission execution, including all feature pairs
        env:
          FAILURE_NOTEBOOK: /tmp/submission-failed.ipynb
        run: |
          set -o pipefail
          python -u run_eda.py | tee /tmp/submission-main-execution.log
      - name: Complete fresh-kernel diagnostic execution
        env:
          NOTEBOOK_PATH: notebooks/asset_vol.ipynb
          FAILURE_NOTEBOOK: /tmp/diagnostic-failed.ipynb
        run: |
          set -o pipefail
          python -u run_eda.py | tee /tmp/submission-diagnostic-execution.log
      - name: Check all notebook outputs, configuration, and forecast deliverables
        run: |
          python - <<'PY'
          import ast,hashlib,json
          from pathlib import Path
          import nbformat,numpy as np,pandas as pd
          assert {p.name for p in Path('notebooks').glob('*.ipynb')}=={'takehome.ipynb','asset_vol.ipynb'}
          assert not Path('src/takehome/forecast.py').exists() and not Path('run_forecast.py').exists()
          assert not list(Path('forecasts').glob('batched_lasso_*'))
          records=[];streams=[]
          for path in Path('notebooks').glob('*.ipynb'):
              nb=nbformat.read(path,4);nbformat.validate(nb)
              code=[c for c in nb.cells if c.cell_type=='code']
              assert [c.execution_count for c in code]==list(range(1,len(code)+1)),path
              for c in code:
                  ast.parse(c.source)
                  assert not any(o.output_type=='error' for o in c.outputs)
                  for o in c.outputs:
                      if o.output_type=='stream':streams.append(f'\n{path.name} {c.metadata.get("tags",[])}\n{o.text}')
              tags=('family_overlay_raw','family_overlay_dszl','family_overlay_interaction','family_overlay_residual','oracle_lead_0','oracle_lead_1','batch_oos_sweep','coefficient_paths','selected_ridge_backtest') if path.stem=='takehome' else ('ridge_sizing_diagnostic','blackout_diagnostic')
              for tag in tags:
                  c=next(c for c in code if tag in c.metadata.get('tags',[]))
                  assert any('image/png' in o.get('data',{}) for o in c.outputs),(path,tag)
              md='\n'.join(c.source for c in nb.cells if c.cell_type=='markdown')
              assert '<span style="color:red">TODO' in md
              assert 'fresh-kernel, complete top-to-bottom execution' in md
              assert 'Asset-volatility experiment: same forecasts' not in md
              records.append(dict(notebook=path.name,code_cells=len(code),figures=sum('image/png' in o.get('data',{}) for c in code for o in c.outputs)))
          p=Path('forecasts');m=json.loads((p/'ridge_metadata.json').read_text())
          assert m['model']=='BatchRidge' and m['feature_transform']=='dszl' and m['dszl_hl']==10
          assert m['model_config']['alpha']==.01 and m['model_config']['fit_intercept']
          assert m['train_years']==m['forecast_years']==2
          assert not m['blackout_targets_used'] and not m['heldout_scoring']
          assert m['oos_rows']==150048 and m['research_forecast_rows']==490543
          assert m['research_metrics']['max_abs_weight']<=3
          for name,sha in m['sha256'].items():assert hashlib.sha256((p/name).read_bytes()).hexdigest()==sha,name
          for stem,rows in [('ridge_oos',150048),('ridge_walk_forward',490543)]:
              frame=pd.read_parquet(p/f'{stem}.parquet');csv=pd.read_csv(p/f'{stem}.csv')
              assert len(frame)==rows and list(csv)==['msgStamp','forecast']
              assert frame.index.is_unique and frame.index.is_monotonic_increasing
              assert np.isfinite(frame.forecast).all()
              np.testing.assert_allclose(frame.forecast,csv.forecast,rtol=1e-12,atol=1e-14)
          report={'notebooks':records,'forecast_metadata':m,'all_checks_passed':True}
          Path('/tmp/submission-verification.json').write_text(json.dumps(report,indent=2)+'\n')
          Path('/tmp/submission-cell-output.txt').write_text(''.join(streams))
          print(json.dumps(report,indent=2))
          PY
          set -o pipefail
          MPLBACKEND=Agg pytest -q | tee /tmp/submission-tests-after.log
          git diff --check
      - name: Publish executed notebooks and inline Ridge forecasts; remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prepare-submission.yml .maintenance/submission-part-0.b64 .maintenance/submission-part-1.b64 .maintenance/submission-part-2.b64
          git add -A README.md run_eda.py run_forecast.py src/takehome/data.py src/takehome/features.py src/takehome/forecast.py tests notebooks forecasts splits.json
          git diff --cached --check
          git commit -m 'Consolidate submission notebook with dszl Ridge, bounded signal sizing and inline forecasts'
          git push origin HEAD:agent/eda-notebook
          git rev-parse HEAD > /tmp/submission-commit.txt
      - name: Package actual forecast bytes and final source, without the input dataset
        run: |
          mkdir -p /tmp/submission-deliverables
          git archive HEAD notebooks src tests README.md run_eda.py requirements.txt pytest.ini splits.json Takehome.txt forecasts | tar -x -C /tmp/submission-deliverables
          cp forecasts/*.parquet /tmp/submission-deliverables/forecasts/
          cp /tmp/submission-verification.json /tmp/submission-tests-after.log /tmp/submission-commit.txt /tmp/submission-deliverables/
          tar -czf /tmp/submission-deliverables.tar.gz -C /tmp/submission-deliverables .
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: submission-notebooks-and-ridge-forecasts
          path: |
            /tmp/submission-deliverables.tar.gz
            /tmp/submission-main-execution.log
            /tmp/submission-diagnostic-execution.log
            /tmp/submission-tests-before.log
            /tmp/submission-tests-after.log
            /tmp/submission-cell-output.txt
            /tmp/submission-verification.json
            /tmp/submission-commit.txt
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: submission-failure-evidence
          path: |
            /tmp/submission-*.log
            /tmp/submission-failed.ipynb
            /tmp/diagnostic-failed.ipynb
          retention-days: 1
